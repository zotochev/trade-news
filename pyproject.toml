[project]
name = "trade-news"
version = "0.1.0"
description = "Aggregator of fundamental market data with LLM annotation and Telegram delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "sqlalchemy>=2.0.40",
    "structlog>=25.0",
    "tenacity>=9.1",
]

[project.scripts]
trade-news = "trade_news.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "respx>=0.23",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trade_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
