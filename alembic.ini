# For generating new migrations: uv run alembic revision --autogenerate -m "..."
# Applying them: uv run trade-news db-upgrade
[alembic]
script_location = trade_news/migrations
sqlalchemy.url = sqlite:///data/trade_news.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
