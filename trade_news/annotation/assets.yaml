# Manual reference data. US equities come from SEC company_tickers.json (trade-news assets-seed).
# symbol is the canonical id (unique per class); symbol and name are aliases automatically.
# aliases: language-neutral / English, aliases_ru: Russian. Matching is case/punctuation-insensitive.

fx:
  - {symbol: EURUSD, name: Euro / US Dollar, base: EUR, quote: USD, aliases: [EUR/USD, euro dollar, euro, fiber], aliases_ru: [евродоллар, евро, евро доллар]}
  - {symbol: GBPUSD, name: British Pound / US Dollar, base: GBP, quote: USD, aliases: [GBP/USD, cable, sterling, pound], aliases_ru: [фунт, фунт стерлингов, кабель]}
  - {symbol: USDJPY, name: US Dollar / Japanese Yen, base: USD, quote: JPY, aliases: [USD/JPY, yen, dollar yen], aliases_ru: [иена, йена, доллар иена]}
