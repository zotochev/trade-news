# nginx in front of the trade-news admin page: HTTPS + auth_basic.
# The app itself listens on 127.0.0.1:ADMIN_PORT only (see .env).
#
# Setup (Debian):
#   sudo apt install nginx apache2-utils certbot python3-certbot-nginx
#   sudo htpasswd -c /etc/nginx/trade-news.htpasswd admin     # -c only for the first user
#   sudo cp deploy/nginx-admin.conf /etc/nginx/sites-available/trade-news-admin
#   # replace admin.example.com below with your domain (its DNS A record must point here)
#   sudo ln -s /etc/nginx/sites-available/trade-news-admin /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d admin.example.com                   # issues the certificate, adds TLS
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name admin.example.com;

    auth_basic "trade-news admin";
    auth_basic_user_file /etc/nginx/trade-news.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;  # ADMIN_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# certbot --nginx turns this into a `listen 443 ssl` server and adds an HTTP → HTTPS redirect.
