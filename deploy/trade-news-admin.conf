server {
    listen 80;
    listen [::]:80;
    server_name kainode.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kainode.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/kainode.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kainode.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "trade-news admin";
    auth_basic_user_file /etc/nginx/trade-news.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
