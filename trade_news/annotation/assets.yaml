  - {symbol: EURJPY, name: Euro / Japanese Yen, base: EUR, quote: JPY, aliases: [EUR/JPY]}
  - {symbol: GBPJPY, name: British Pound / Japanese Yen, base: GBP, quote: JPY, aliases: [GBP/JPY]}
  - {symbol: EURCHF, name: Euro / Swiss Franc, base: EUR, quote: CHF, aliases: [EUR/CHF]}
  - {symbol: USDCNH, name: US Dollar / Chinese Yuan, base: USD, quote: CNH, aliases: [USD/CNH, USD/CNY, USDCNY, yuan, renminbi], aliases_ru: [юань]}
