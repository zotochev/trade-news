# Non-secret settings. Secrets (API keys, tokens) go to environment variables, see .env.example.
# DATABASE_URL env var overrides database_url.
database_url: sqlite:///data/trade_news.db

dedup:
  window_hours: 6        # compare only with items published within ±N hours
  fuzzy_threshold: 90    # rapidfuzz token_sort_ratio, 0..100
  min_title_len: 20      # shorter titles are not fuzzy-matched (too many false positives)

# Old data is deleted by a daily job (and `trade-news cleanup`), whole dedup groups at a time.
retention:
  unannotated_days: 30   # never reached the LLM (Form 4, first-run backlog, ...)
  annotated_days: 365    # kept longer: validation (stage 5) needs history
  logs_days: 90          # collector_runs, llm_calls
  interval_hours: 24

sectors:                 # equity sector/industry from SEC SIC codes, for stocks seen in news
  interval_minutes: 10
  batch: 100             # SEC requests per run (shares rate_limits.sec with sec_edgar)

background_digest:       # "Фон рынка": news below the delivery thresholds, by industry
  enabled: false         # off 2026-10-07 (not useful enough); true + restart to bring back
  hours_utc: [13, 17, 21]  # before the US open, mid-session, after the close
  min_importance: 2        # importance 1 is noise (routine filings)
  max_assets_per_sector: 5
  max_window_hours: 16     # the first digest (or one after downtime) looks back at most this far

# Shared limiters. Several sources may point at one key (e.g. all SEC hosts share one quota).
# Values are deliberately below documented limits.
flows:                   # forced flows calendar in Telegram (trade_news/flows/notify.py)
  enabled: true
  digest_weekday: 0        # Monday
  digest_hour_utc: 5       # 08:00 Moscow
  reminder_hour_utc: 15    # major events of the next business day

crypto:                  # liquidation websocket streams, started by `run` (trade_news/crypto)
  liquidations: true
  exchanges: [binance, bybit, okx]

rate_limits:
  moex:                  # MOEX ISS, free; be polite
    calls: 4
    period: 1
  crypto:                # Binance/Bybit/OKX public REST; OKX rubik stats allow 5 per 2 s
    calls: 3
    period: 1
  sec:                   # documented: 10 req/s per user across all machines
    calls: 5
    period: 1
  finnhub:               # documented free plan: 60 calls/min
    calls: 45
    period: 60

sources:
  sec_edgar:
    interval_seconds: 120
    rate_limit: sec
    params:
      forms: ["8-K", "10-Q", "10-K", "4", "SCHEDULE 13D"]  # 13D: holdings > 5% (13D/A comes with it)
      max_pages: 5       # 100 entries per page; stops early when it reaches known filings
      form4_details: true              # fetch each new Form 4 and parse the trades (1 request each)
      form4_max_details_per_run: 150
      form4_thresholds:                # only these go to the LLM; the rest is stored, not annotated
        min_buy_usd: 100000            # open-market purchase (code P)
        min_sell_usd: 1000000          # open-market sale (code S)
        skip_planned_sales: true       # sales under a Rule 10b5-1 plan carry no signal
        cfo_only: true                 # of insiders only the CFO's trades (best copy returns)

  finnhub_market_news:
    interval_seconds: 300
    rate_limit: finnhub
    params:
      categories: [general, merger]

  finnhub_company_news:
    interval_seconds: 900
    rate_limit: finnhub
    params:
      symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA]
      lookback_days: 2

  # Free plan: 100 requests/day, 3 articles per request. 1200 s = 72 requests/day; the budget
  # is a hard daily cap (UTC day) kept in the cursor, below the plan to leave room for errors.
  marketaux:
    interval_seconds: 1200
    params:
      daily_request_budget: 80
      query: {}          # overrides of the API filters, e.g. {countries: "us,ca"}

  # CoinDesk RSS, no key, ~25 newest articles. Entries older than max_age_hours are stored
  # but never annotated (the feed returns days of history); 6 h = llm.max_item_age_hours.
  # Forced flows calendar (trade_news/flows): computed dates a year ahead + RU production
  # calendar (isdayoff.ru) + BTC halving estimate (mempool.space). Upsert by key: reruns are safe.
  flow_rules:
    interval_seconds: 21600
    params: {horizon_days: 365, refresh_days: 7}

  # Earnings of the largest US companies (-> buyback blackout ~4 weeks before) and IPO lock-ups.
  # 2 requests per run, shares the Finnhub limit.
  finnhub_calendar:
    interval_seconds: 21600
    rate_limit: finnhub
    params:
      earnings_days: 90
      blackout_days: 28
      lockup_days: 180
      min_ipo_usd: 100000000     # lock-ups of IPOs from $100M (SPACs skipped)
      major_ipo_usd: 3000000000  # major (eve reminder, bold in the digest) from $3B
      symbols: [AAPL, MSFT, NVDA, GOOGL, GOOG, AMZN, META, AVGO, TSLA, BRK.B, LLY, JPM, V, WMT,
                ORCL, XOM, MA, UNH, COST, NFLX, HD, PG, JNJ, ABBV, BAC, PLTR, KO, CRM, AMD, CVX,
                TMUS, WFC, CSCO, MRK, PM, IBM, ABT, GE, MU, LIN, MCD, MS, GS, AXP, PEP, DIS,
                INTU, NOW, ISRG, TMO, UBER, QCOM, CAT, T, VZ, TXN, BKNG, ADBE, AMGN, RTX,
                ANET, AMAT, LRCX, SPGI, BLK, SCHW, PFE, C, BA, HON]

  # Upcoming Treasury auctions (~10 days ahead, TreasuryDirect, no key); bills are skipped.
  treasury_auctions:
    interval_seconds: 21600
    params: {include_bills: false}

  # Crypto leverage history (part B of docs/tasks/forced-flows.md): OI, funding, long/short
  # on Binance, Bybit, OKX every 5 min, ~40 requests per run. Kept forever (crypto_derivs).
  crypto_leverage:
    interval_seconds: 300
    rate_limit: crypto
    params:
      always: [BTC, ETH]
      top: 10                  # + the largest by open interest (Bybit), re-ranked daily
      exclude: [XAUT, XAU, PAXG, USDC, USDE]   # gold and stablecoin contracts

  # Russia (part C of docs/tasks/forced-flows.md)
  # Minfin FX operations: minfin.gov.ru is closed to non-Russian IPs, so the monthly announcement
  # is read from TASS / RIA / Vedomosti feeds around the 3rd business day; polls only then.
  ru_minfin:
    interval_seconds: 600
    params:
      window_days: 3
      # Bank of Russia "mirroring" of NWF spending, announced twice a year; negative = sells.
      # H2 2026: sales 0.58 bn RUB/day (cbr.ru, 2026-06-29). UPDATE in January and July.
      cbr_mirroring_rub_bn_day: -0.58

  # Dividend cut-offs of IMOEX members (smart-lab.ru calendar + ISS index composition).
  moex_dividends:
    interval_seconds: 21600
    params:
      major_yield_pct: 7       # or
      major_weight_pct: 3      # weight in IMOEX, %

  # Open positions of individuals / legal entities in MOEX futures (ISS, daily, no key).
  # Each run also walks the history back backfill_per_run days, down to backfill_from.
  moex_open_positions:
    interval_seconds: 3600
    rate_limit: moex
    params:
      assets: [Si, RTS, CNY]
      lookback_days: 5
      backfill_per_run: 30
      backfill_from: "2021-01-01"

  # Vesting schedules from DefiLlama (no key). Project files are up to ~17 MB and parsed as a
  # stream; per_run of them each run, so the whole list (~370) is refreshed every ~2.5 days.
  token_unlocks:
    interval_seconds: 1800
    params:
      per_run: 3
      min_pct: 1.0             # one-off release >= 1% of the supply unlocked so far
      min_usd: 5000000         # ... and >= $5M at the current price
      lead_days: 3             # news item this far ahead of the release
      horizon_days: 365        # releases kept in the table / cursor

  coindesk:
    interval_seconds: 300
    params: {max_age_hours: 6}

  # CME FedWatch, no key (unofficial cme-fedwatch package). Settlements change once per
  # business day; each new one is stored in rate_expectations. A news item is created when an
  # outcome of one of the nearest `meetings_ahead` meetings moves by >= min_shift_pp points.
  cme_fedwatch:
    interval_seconds: 3600
    params:
      meetings_ahead: 3
      min_shift_pp: 10

  # FRED (free key, 120 requests/min): one request per series per run. New observations go to
  # macro_observations; series with alert_bp create a news item on a big day-over-day move.
  # The monthly series supply actual values for the economic calendar.
  fred:
    interval_seconds: 3600
    params:
      lookback_days: 400   # history loaded on the first run
      series:
        - {id: DGS2, name: US 2-year Treasury yield, alert_bp: 10, hint: "US Treasury yields (USD, US rates)"}
        - {id: DGS10, name: US 10-year Treasury yield, alert_bp: 10, hint: "US Treasury yields (USD, US rates)"}
        - {id: DFF, name: Effective federal funds rate}
        - {id: CPIAUCSL, name: US CPI}
        - {id: CPILFESL, name: US core CPI}
        - {id: PAYEMS, name: US nonfarm payrolls}
        - {id: UNRATE, name: US unemployment rate}

  # Economic calendar: ForexFactory weekly JSON (no key, no actual values) + actuals of US data
  # computed from FRED. Titles must match ForexFactory exactly: high-impact USD events without
  # a mapping are logged as ff_unmapped_usd_event. calc: level | diff | mom_pct | yoy_pct.
  ff_calendar:
    interval_seconds: 1800
    params:
      min_impact: Medium          # Low | Medium | High: stored in econ_events
      release_window_hours: 12    # stop waiting for the FRED value after this
      fred_actuals:
        - {title: "CPI m/m", series: CPIAUCSL, calc: mom_pct, decimals: 1}
        - {title: "Core CPI m/m", series: CPILFESL, calc: mom_pct, decimals: 1}
        - {title: "CPI y/y", series: CPIAUCNS, calc: yoy_pct, decimals: 1}
        - {title: "Core PCE Price Index m/m", series: PCEPILFE, calc: mom_pct, decimals: 1}
        - {title: "Non-Farm Employment Change", series: PAYEMS, calc: diff, decimals: 0}
        - {title: "Unemployment Rate", series: UNRATE, calc: level, decimals: 1}
        - {title: "Unemployment Claims", series: ICSA, calc: level, scale: 0.001, decimals: 0}

  # Central bank RSS, no key. Each feed returns weeks of history; entries older than
  # max_age_hours are stored but never annotated. Override the feed list with `feeds: [...]`.
  fed_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  ecb_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  boe_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  boj_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}

# LLM annotation. Only these two models, tried in order. daily_request_limit / rpm_limit are
# this app's share of the Gemini project quota (the rest belongs to other apps on the same key).
llm:
  provider: gemini
  batch_size: 25           # news items per request
  interval_seconds: 120    # how often the annotation job looks for new items
  max_batches_per_run: 10
  max_item_age_hours: 6    # older items (e.g. the first-run backlog) are never annotated
  body_max_chars: 1500
  quota_reset_hour_utc: 8  # Gemini daily quota resets at midnight Pacific
  exclude:                 # {source: x, title_regex: "..."}: stored, never sent to the LLM
    # Routine operations and statistics of central banks: no market signal.
    - source: boj_rss
      title_regex: "(?i)funds-supplying operations|government bonds held by|current account balances|statistics|principal figures|schedule of outright purchases|scams|bank of japan accounts|figures on fails|amounts outstanding|transactions with the government|collateral accepted|average contract interest|\\(boj review\\)|discussion paper|market operations by|financial results of"
    - source: boe_rss
      title_regex: "(?i)market notice|statistical notice|green notice|^minutes of the (?!monetary policy)|rtgs|announces new office|^pra |banknote|cv and questionnaire|consortium minutes"
    - source: fed_rss
      title_regex: "(?i)enforcement action|approval of (the )?application"
  models:                  # prices: paid tier USD per 1M tokens, for cost estimates only
    - name: gemini-3.5-flash-lite
      daily_request_limit: 300
      rpm_limit: 15
      price_in_per_mtok: 0.30
      price_out_per_mtok: 2.50
    - name: gemini-3.1-flash-lite
      daily_request_limit: 300
      rpm_limit: 15
      price_in_per_mtok: 0.25
      price_out_per_mtok: 1.50
