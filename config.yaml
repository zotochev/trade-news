# Non-secret settings. Secrets (API keys, tokens) go to environment variables, see .env.example.
# DATABASE_URL env var overrides database_url.
database_url: sqlite:///data/trade_news.db

dedup:
  window_hours: 6        # compare only with items published within ±N hours
  fuzzy_threshold: 90    # rapidfuzz token_sort_ratio, 0..100
  min_title_len: 20      # shorter titles are not fuzzy-matched (too many false positives)

# Old data is deleted by a daily job (and `trade-news cleanup`), whole dedup groups at a time.
retention:
  unannotated_days: 30   # never reached the LLM (Form 4, first-run backlog, ...)
  annotated_days: 365    # kept longer: validation (stage 5) needs history
  logs_days: 90          # collector_runs, llm_calls
  interval_hours: 24

# Shared limiters. Several sources may point at one key (e.g. all SEC hosts share one quota).
# Values are deliberately below documented limits.
rate_limits:
  sec:                   # documented: 10 req/s per user across all machines
    calls: 5
    period: 1
  finnhub:               # documented free plan: 60 calls/min
    calls: 45
    period: 60

sources:
  sec_edgar:
    interval_seconds: 120
    rate_limit: sec
    params:
      forms: ["8-K", "10-Q", "10-K", "4"]
      max_pages: 5       # 100 entries per page; stops early when it reaches known filings
      form4_details: true              # fetch each new Form 4 and parse the trades (1 request each)
      form4_max_details_per_run: 150
      form4_thresholds:                # only these go to the LLM; the rest is stored, not annotated
        min_buy_usd: 100000            # open-market purchase (code P)
        min_sell_usd: 1000000          # open-market sale (code S)
        skip_planned_sales: true       # sales under a Rule 10b5-1 plan carry no signal

  finnhub_market_news:
    interval_seconds: 300
    rate_limit: finnhub
    params:
      categories: [general, merger]

  finnhub_company_news:
    interval_seconds: 900
    rate_limit: finnhub
    params:
      symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA]
      lookback_days: 2

  # Free plan: 100 requests/day, 3 articles per request. 1200 s = 72 requests/day; the budget
  # is a hard daily cap (UTC day) kept in the cursor, below the plan to leave room for errors.
  marketaux:
    interval_seconds: 1200
    params:
      daily_request_budget: 80
      query: {}          # overrides of the API filters, e.g. {countries: "us,ca"}

  # CoinDesk RSS, no key, ~25 newest articles. Entries older than max_age_hours are stored
  # but never annotated (the feed returns days of history); 6 h = llm.max_item_age_hours.
  coindesk:
    interval_seconds: 300
    params: {max_age_hours: 6}

  # CME FedWatch, no key (unofficial cme-fedwatch package). Settlements change once per
  # business day; each new one is stored in rate_expectations. A news item is created when an
  # outcome of one of the nearest `meetings_ahead` meetings moves by >= min_shift_pp points.
  cme_fedwatch:
    interval_seconds: 3600
    params:
      meetings_ahead: 3
      min_shift_pp: 10

  # FRED (free key, 120 requests/min): one request per series per run. New observations go to
  # macro_observations; series with alert_bp create a news item on a big day-over-day move.
  # The monthly series supply actual values for the economic calendar.
  fred:
    interval_seconds: 3600
    params:
      lookback_days: 400   # history loaded on the first run
      series:
        - {id: DGS2, name: US 2-year Treasury yield, alert_bp: 10, hint: "US Treasury yields (USD, US rates)"}
        - {id: DGS10, name: US 10-year Treasury yield, alert_bp: 10, hint: "US Treasury yields (USD, US rates)"}
        - {id: DFF, name: Effective federal funds rate}
        - {id: CPIAUCSL, name: US CPI}
        - {id: CPILFESL, name: US core CPI}
        - {id: PAYEMS, name: US nonfarm payrolls}
        - {id: UNRATE, name: US unemployment rate}

  # Central bank RSS, no key. Each feed returns weeks of history; entries older than
  # max_age_hours are stored but never annotated. Override the feed list with `feeds: [...]`.
  fed_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  ecb_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  boe_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}
  boj_rss:
    interval_seconds: 600
    params: {max_age_hours: 24}

# LLM annotation. Only these two models, tried in order. daily_request_limit / rpm_limit are
# this app's share of the Gemini project quota (the rest belongs to other apps on the same key).
llm:
  provider: gemini
  batch_size: 25           # news items per request
  interval_seconds: 120    # how often the annotation job looks for new items
  max_batches_per_run: 10
  max_item_age_hours: 6    # older items (e.g. the first-run backlog) are never annotated
  body_max_chars: 1500
  quota_reset_hour_utc: 8  # Gemini daily quota resets at midnight Pacific
  exclude:                 # {source: x, title_regex: "..."}: stored, never sent to the LLM
    # Routine operations and statistics of central banks: no market signal.
    - source: boj_rss
      title_regex: "(?i)funds-supplying operations|government bonds held by|current account balances|statistics|principal figures|schedule of outright purchases|scams|bank of japan accounts|figures on fails|amounts outstanding|transactions with the government|collateral accepted|average contract interest|\\(boj review\\)|discussion paper|market operations by|financial results of"
    - source: boe_rss
      title_regex: "(?i)market notice|statistical notice|green notice|^minutes of the (?!monetary policy)|rtgs|announces new office|^pra |banknote|cv and questionnaire|consortium minutes"
    - source: fed_rss
      title_regex: "(?i)enforcement action|approval of (the )?application"
  models:                  # prices: paid tier USD per 1M tokens, for cost estimates only
    - name: gemini-3.5-flash-lite
      daily_request_limit: 300
      rpm_limit: 15
      price_in_per_mtok: 0.30
      price_out_per_mtok: 2.50
    - name: gemini-3.1-flash-lite
      daily_request_limit: 300
      rpm_limit: 15
      price_in_per_mtok: 0.25
      price_out_per_mtok: 1.50
